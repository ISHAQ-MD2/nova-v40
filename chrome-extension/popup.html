<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NOVA Assistant Bridge</title>
  <style>
    body {
      margin: 0;
      padding: 14px;
      width: 260px;
      background: #0b1220;
      color: #e8eef7;
      font-family: system-ui, -apple-system, sans-serif;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 15px;
      letter-spacing: 0.08em;
      color: #00e5ff;
    }
    p {
      margin: 0 0 12px;
      font-size: 12px;
      color: #9aa6b8;
    }
    button {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 8px;
      border: 1px solid #00e5ff;
      border-radius: 8px;
      background: #141e33;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }
    button:hover {
      background: #1d2c4a;
    }
    #status {
      margin-top: 4px;
      font-size: 11px;
      color: #ffb4d4;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <h1>NOVA ASSISTANT</h1>
  <p>Send current page or selected text to NOVA on Android.</p>
  <button id="send-page">Send this page to Nova</button>
  <button id="ask-selection">Ask Nova about selection</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
